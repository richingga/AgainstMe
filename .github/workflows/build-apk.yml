name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies & Build Web App
        run: |
          cd app
          npm install
          npm run build
          npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x app/android/gradlew

      - name: Build Android APK
        run: |
          cd app/android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK to Againstmev1.apk
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk Againstmev1.apk

      - name: Publish to GitHub Releases (Direct APK Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AgainstMe v1.0 (Official APK)"
          body: |
            Selamat datang di aplikasi pemulihan diri AgainstMe v1.0!
            
            Silakan klik link **Againstmev1.apk** di bawah untuk langsung mengunduh dan memasang di HP Android kamu.
          files: Againstmev1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
