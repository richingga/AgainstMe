name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies & Build Web App
        run: |
          cd app
          npm install
          npm run build
          npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x app/android/gradlew

      - name: Build Android APK
        run: |
          cd app/android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Get Version Number
        id: version
        run: |
          VERSION_FILE=version.txt
          if [ ! -f "$VERSION_FILE" ]; then
            echo "1.0" > $VERSION_FILE
          fi
          CURRENT_VERSION=$(cat $VERSION_FILE)
          echo "VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          
          # Increment minor version for next build
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          NEXT_MINOR=$((MINOR + 1))
          echo "${MAJOR}.${NEXT_MINOR}" > $VERSION_FILE

      - name: Commit Version File
        run: |
          git config user.name "nggaeth"
          git config user.email "nggaeth@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: bump version to next build" || echo "No version change"
          git push || echo "Nothing to push"

      - name: Rename APK with Version
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk AgainstMe-v${{ env.VERSION }}.apk
          echo "APK_NAME=AgainstMe-v${{ env.VERSION }}.apk" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: "AgainstMe v${{ env.VERSION }}"
          body: |
            AgainstMe - Aplikasi Pemulihan Diri dari Kebiasaan Buruk
            
            Versi: ${{ env.VERSION }}
            Tanggal: ${{ github.event.head_commit.timestamp }}
            Commit: ${{ github.sha }}
            
            Download APK di bawah untuk install di HP Android.
          files: ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
