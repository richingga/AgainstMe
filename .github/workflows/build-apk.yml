name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies & Build Web App
        run: |
          cd app
          npm install
          npm run build
          npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x app/android/gradlew

      - name: Build Android APK
        run: |
          cd app/android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK with Commit SHA
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          cp app/android/app/build/outputs/apk/debug/app-debug.apk AgainstMe-${SHORT_SHA}.apk
          echo "APK_NAME=AgainstMe-${SHORT_SHA}.apk" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

      - name: Publish to GitHub Releases (Auto-versioned by Commit)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.SHORT_SHA }}
          name: "AgainstMe Build ${{ env.SHORT_SHA }}"
          body: |
            🚀 **AgainstMe APK Build**
            
            📦 Commit: `${{ github.sha }}`
            🔨 Build: ${{ env.SHORT_SHA }}
            📅 Tanggal: ${{ github.event.head_commit.timestamp }}
            
            Klik **${{ env.APK_NAME }}** di bawah untuk download langsung ke HP Android.
          files: ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
